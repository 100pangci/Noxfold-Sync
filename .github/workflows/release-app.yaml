name: Release App

permissions:
  attestations: write
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.1.4.0). Leave empty when triggered on a tag ref.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-app
  cancel-in-progress: true

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build Release
    uses: ./.github/workflows/common-build.yaml
    with:
      buildType: "Release"
      checkoutRef: ${{ github.event.inputs.tag || github.ref_name }}

  sign:
    name: Sign Release
    needs: build
    uses: ./.github/workflows/common-sign.yaml
    with:
      applicationId: "com.github.ywpc05.syncthingfork"
      buildType: "release"
    secrets: inherit

  release:
    name: Create release and attach artifacts
    needs: [sign]
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: "Download signed artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-com.github.ywpc05.syncthingfork
          path: ./artifacts

      - name: Create GitHub build provenance attestations
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ./artifacts/*

      - name: Create draft release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          artifacts: "./artifacts/*.apk"
          artifactErrorsFailBuild: true
          name: Noxfold-Sync ${{ github.event.inputs.tag || github.ref_name }}
          bodyFile: "app/src/main/play/release-notes/en-US/default.txt"
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-rc.') }}
          draft: true
          allowUpdates: true
